name: Go CI

on:
  push:
    branches: [main, code-agent]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Smoke test
        run: |
          test "$(./bin/authopus)" = "Hello World!"
          test "$(./bin/authopusctl)" = "Hello World!"
